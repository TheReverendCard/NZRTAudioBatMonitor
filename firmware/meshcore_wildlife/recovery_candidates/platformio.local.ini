; NZRT transient development target; NOT a public/production build.
[env:NZRT_Xiao_S3_WIO_wildlife_repeater]
extends = env:Xiao_S3_WIO_repeater
build_flags =
  ${env:Xiao_S3_WIO_repeater.build_flags}
  -I nzrt
  -D NZRT_WILDLIFE_MIC=1
  -D LORA_CR=5
  -D LORA_TX_POWER=10
build_unflags =
  -D LORA_TX_POWER=22
build_src_filter =
  ${env:Xiao_S3_WIO_repeater.build_src_filter}
  +<../nzrt/WildlifeMic.cpp>
  +<../nzrt/WildlifeDetector.cpp>
  +<../nzrt/WildlifeTime.cpp>
  +<../nzrt/WildlifeDay.cpp>

lib_deps =
  ${env:Xiao_S3_WIO_repeater.lib_deps}
  HTTPClient
  WiFiClientSecure
