name: Firmware checks
on:
  pull_request:
    paths: ['firmware/**', 'tests/**', '.github/workflows/firmware.yml']
  push:
    branches: [main]
    paths: ['firmware/**', 'tests/**', '.github/workflows/firmware.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test CPU power policy
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror tests/cpu_power_policy_test.cpp -o /tmp/cpu-policy-test
          /tmp/cpu-policy-test
          g++ -std=c++11 -Wall -Wextra -Werror tests/sleep_policy_test.cpp -o /tmp/sleep-policy-test
          /tmp/sleep-policy-test
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.3.1'
      - name: Install pinned ESP32 board support
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile XIAO recorder with OPI PSRAM and USB CDC
        run: >-
          arduino-cli compile
          --fqbn 'esp32:esp32:XIAO_ESP32S3:PSRAM=opi,USBMode=hwcdc,CDCOnBoot=default,CPUFreq=240,FlashSize=8M,PartitionScheme=default_8MB'
          --warnings default
          firmware/xiao_bat_overnight
      - name: Compile short sleep self-test mode
        run: >-
          arduino-cli compile
          --fqbn 'esp32:esp32:XIAO_ESP32S3:PSRAM=opi,USBMode=hwcdc,CDCOnBoot=default,CPUFreq=240,FlashSize=8M,PartitionScheme=default_8MB'
          --build-property 'compiler.cpp.extra_flags=-DSLEEP_SELF_TEST=1'
          --warnings default
          firmware/xiao_bat_overnight
